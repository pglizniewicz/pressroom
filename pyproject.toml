[project]
name = "pressroom"
version = "0.1.0"
requires-python = ">=3.14"

# These three are what every scraper needs. This list said `[]` for a long
# time while the code imported all of them, so a fresh checkout only worked on
# a machine that happened to have Fedora's python3-requests RPMs installed.
dependencies = [
    "requests",
    "beautifulsoup4",
    "python-dateutil",
]

[project.optional-dependencies]
# One source, one dependency. GlobeNewswire sits behind Akamai Bot Manager,
# which drops requests/urllib3 on the TLS fingerprint - see
# globenewswire.make_session. curl_cffi is imported lazily inside that function,
# so every other module imports and runs fine without it; only this source
# breaks, and it breaks with a plain ImportError.
#
# It is an extra rather than a base dependency because it ships a patched
# libcurl in its wheel, and this repo's readers (database/, release/control/
# query.py, browser/) are dependency-free. The documented install
# line includes it anyway, so the normal path is not missing anything.
#
# There is no `dev` extra: the test suite is stdlib unittest, run with
# `python -m unittest discover -s tests`, so a fresh checkout needs nothing
# extra to verify itself.
globenewswire = ["curl_cffi"]

# One entry point per thing anyone runs; tests/test_entry_points.py asserts the
# four families and their sizes. Declared rather than left as
# `python -m pressroom.terratec.boundary.portal`, because the layer path is an
# implementation detail of where the code is and does not belong in a
# documented command line.
[project.scripts]
# The corpus
pressroom-search              = "pressroom.release.boundary.search:main"
pressroom-serve               = "pressroom.browser.boundary.http:main"

# Read-only checks - run after anything that touches bodies or origins
pressroom-verify-names        = "pressroom.names:main"
pressroom-verify-body-origin  = "pressroom.provenance.boundary.verification:main"
pressroom-verify-encoding     = "pressroom.text.boundary.encoding_check:main"

# Read-only review passes over the whole cache
pressroom-calibrate-containers  = "pressroom.text.boundary.container_calibration:main"
pressroom-calibrate-converters = "pressroom.converter.boundary.calibration:main"

# Sources, by firm
pressroom-intel               = "pressroom.intel.boundary.press:main"
pressroom-amd                 = "pressroom.amd.boundary.press:main"
pressroom-creative            = "pressroom.creative.boundary.press:main"
pressroom-creative-gnw        = "pressroom.creative.boundary.globenewswire:main"
pressroom-soundonsound        = "pressroom.soundonsound.boundary.magazine:main"
pressroom-terratec-early      = "pressroom.terratec.boundary.early:main"
pressroom-terratec            = "pressroom.terratec.boundary.pressemit:main"
pressroom-terratec-portal     = "pressroom.terratec.boundary.portal:main"
pressroom-terratec-cms        = "pressroom.terratec.boundary.cms:main"
pressroom-maudio-golive       = "pressroom.maudio.boundary.golive:main"
pressroom-maudio-pressdb      = "pressroom.maudio.boundary.pressdb:main"
pressroom-maudio-media-pr     = "pressroom.maudio.boundary.media_pr:main"
pressroom-maudio-media-news   = "pressroom.maudio.boundary.media_news:main"
pressroom-maudio-de           = "pressroom.maudio.boundary.presse_de:main"
pressroom-maudio-news         = "pressroom.maudio.boundary.news_blog:main"

# Pinned rather than auto-discovered. Flat-layout auto-discovery refuses to
# guess once a package and loose top-level modules coexist ("multiple
# top-level packages discovered"), which is exactly the state a move through
# this tree passes through.
[tool.setuptools.packages.find]
include = ["pressroom*"]

# The browser's three files are served from a name whitelist in
# browser/boundary/http.py, so they have to be installed with the package.
[tool.setuptools.package-data]
"pressroom.browser.boundary" = ["static/*"]

# ruff, on its own defaults - 88 columns, double quotes, and target-version read
# straight out of requires-python above. The formatter needs no configuration at
# all; this section exists only to pin the lint selection.
[tool.ruff.lint]
# ruff's own default set - pyflakes plus the pycodestyle rules that catch real
# breakage. Pinned rather than inherited, so a change to ruff's defaults is not
# silently a change to this repo.
#
# It is worth having: F821 found three calls to `snapshot_url` in
# fetcher/control/archive.py that imported nothing of the kind, in code
# pressroom-verify-names reports clean (it only inspects `module.attr` forms) and
# the hermetic suite never reaches (they are network paths).
#
# E501 is out. After formatting, 26 lines still exceed 88, and every
# one of them is an HTML template, a SQL string, a User-Agent or a message meant
# for a human - things the formatter will not split and should not.
select = ["E4", "E7", "E9", "F"]
